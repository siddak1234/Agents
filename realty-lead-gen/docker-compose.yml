# Local development stack. Production uses managed services (RDS/Aurora, ElastiCache).
# Split into profiles so `--profile dev` gives you just deps; `--profile full` runs the app too.

services:
  postgres:
    image: postgis/postgis:17-3.5
    profiles: ["dev", "full", "test"]
    environment:
      POSTGRES_USER: rlg
      POSTGRES_PASSWORD: rlg
      POSTGRES_DB: rlg
      # Postgres 17 defaults we care about for a schema-heavy workload
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rlg -d rlg"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    profiles: ["dev", "full", "test"]
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: ["full"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://rlg:rlg@postgres:5432/rlg
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    command: ["uvicorn", "realty_lead_gen.main:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    profiles: ["full"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://rlg:rlg@postgres:5432/rlg
      REDIS_URL: redis://redis:6379/0
    command: ["arq", "realty_lead_gen.worker.WorkerSettings"]

volumes:
  pg_data:
  redis_data:
