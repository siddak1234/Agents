[alembic]
script_location = alembic
prepend_sys_path = . src
; Alembic 1.18 deprecated the legacy "split on spaces, commas or colons"
; parsing of prepend_sys_path/version_locations. `os` means "use this
; platform's path separator", which is what we want for a repo that is
; developed and built on POSIX.
path_separator = os
sqlalchemy.url = driver://user:pass@localhost/dbname  ; overridden by env.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 60
revision_environment = false

; Generated revisions go through the same formatter and linter as hand-written
; code, so a migration never lands as the one file CI has to special-case.
;
; `type = exec` rather than `console_scripts`: ruff ships as a prebuilt binary
; and registers no console_scripts entry point, so the entrypoint lookup that
; `console_scripts` performs fails with "Could not find entrypoint
; console_scripts.ruff" no matter that the executable is right there on PATH.
[post_write_hooks]
hooks = ruff_fix,ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix --exit-zero REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
