# Root CI for the orchestrator and the agent contract.
#
# GitHub Actions only discovers workflows in `.github/workflows` at the
# repository root. Anything nested inside an agent folder is never run, which
# is why every agent's pipeline lives here behind a `paths:` filter rather
# than in the agent's own folder.
#
# Two jobs, split by what they cost:
#
#   contract  — no agent dependencies. The template agent is standard library
#               only, so this stays fast and runs on every change.
#   handshake — syncs each real agent and calls `describe` on it. This is the
#               integration gate: it catches a registry that has drifted from
#               disk, a broken entrypoint, and a manifest that no longer
#               matches its agent's code.

name: orchestrator

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: contract + template
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          # The root project's lockfile. Without this the action guesses, and
          # in a monorepo it can key the cache off an agent's lockfile instead.
          cache-dependency-glob: uv.lock
      - name: Sync
        run: uv sync --frozen

      # Root-owned code only. Agent folders lint themselves with their own
      # config, in their own workflow.
      - name: Ruff format check
        run: uv run ruff format --check orchestrator tests _template
      - name: Ruff lint
        run: uv run ruff check orchestrator tests _template
      - name: Mypy (strict)
        run: uv run mypy orchestrator

      # Loads every manifest and checks the registry against what is on disk,
      # without running any agent. Fails on a registered path that does not
      # exist, a malformed agent.yaml, a duplicate agent, or a manifest whose
      # name disagrees with its folder.
      - name: Validate the registry
        run: uv run agents list

      - name: Contract and template tests
        run: uv run pytest -q

  handshake:
    name: agents check (live)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Sync the orchestrator
        run: uv sync --frozen

      # Each agent is synced in its own folder, never resolved against the
      # orchestrator's dependencies. Add a line here when you add an agent
      # that needs an environment; a standard-library agent needs nothing.
      - name: Sync realty-lead-gen
        run: uv sync --frozen
        working-directory: realty-lead-gen

      # Calls `describe` on every registered agent. Cheap by design — no
      # network, no credentials, no cost — so it can gate every merge.
      - name: Describe every agent
        run: uv run agents check
