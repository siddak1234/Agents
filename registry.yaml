# Agent registry — which agents exist in this repository.
#
# Paths only. Everything else about an agent lives in that agent's own
# `agent.yaml`, so adding a capability or renaming a module never touches
# this file, and an agent folder stays self-describing if extracted.
#
# Discovery is by declaration, never by globbing: a folder appearing in the
# repository is not enough to make it callable. It has to be listed here and
# it has to contain an `agent.yaml`, or `agents check` fails.
#
# Agents live under `agents/` — tenant space, visually separate from the
# platform. The declared folder name must equal the `name` in its
# agent.yaml.

version: 2

agents:
  - path: agents/realty-lead-gen
  - path: agents/case-preparation-gap-detection
  - path: agents/phishing-incident-triage
  - path: agents/operations-maintenance-agent
  - path: agents/investment-due-diligence
  - path: agents/commercial-lease-agent
