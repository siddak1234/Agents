# Agent registry
#
# One entry per agent. Each agent lives in its own top-level folder; the
# `path` field is that folder, relative to the repository root.
#
# This file is the single source of truth for "what agents exist here". The
# orchestrator at the repository root is expected to read it for discovery
# rather than globbing directories, so that adding a folder is never enough
# to accidentally activate an agent.
#
# The orchestrator itself has not been built yet. Until it is, no field
# below is load-bearing for any running code — treat this as a contract
# being drafted, and expect the schema to change once the orchestrator's
# real needs are known.

version: 1

agents:
  - name: realty-lead-gen
    path: realty-lead-gen
    status: active
    language: python
    python: "3.13"

    summary: >-
      Agentic real-estate lead-generation backend. Ingests listings from MLS,
      portals, and off-market sources; enriches each property with
      Claude-powered condition grading, valuation, and comps; scores per
      persona (flipper / wholesaler / buyer's agent); and materializes ranked
      leads into Postgres for a frontend to consume.

    # How this agent is started today. Both are module paths inside the
    # agent's own src/ layout, run from the agent's folder.
    entrypoints:
      api: realty_lead_gen.main:app # FastAPI ASGI app
      worker: realty_lead_gen.worker:WorkerSettings # arq worker

    # How the outside world talks to it. This agent exposes a REST API and
    # does not currently implement any orchestrator-level calling convention.
    interface: http

    # Infrastructure the agent needs in order to run at all.
    depends_on:
      - postgres # 17 + PostGIS 3.5, canonical store
      - redis # 7, arq queue + short-term cache

    docs:
      readme: realty-lead-gen/README.md
      architecture: realty-lead-gen/ARCHITECTURE.md

    notes: >-
      Boots without any vendor API keys — source adapters disable themselves
      when their credentials are absent, so the pipeline degrades gracefully
      in dev. See realty-lead-gen/.env.example for the full key list.
