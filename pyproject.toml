[project]
name = "agents-orchestrator"
version = "0.1.0"
description = "Discovers and calls the agents in this repository over agentcall/v1."
readme = "README.md"
requires-python = ">=3.13"

# One dependency, on purpose. The orchestrator's job is to read a manifest
# and spawn a process; everything else is the standard library. Each agent
# brings its own dependency set inside its own folder, which is what keeps a
# heavy agent from making the orchestrator heavy.
dependencies = ["pyyaml>=6.0"]

[project.scripts]
agents = "orchestrator.cli:main"

# Deliberately NOT a uv workspace. Declaring the agent folders as workspace
# members would resolve every agent's dependencies into one lockfile, which
# is exactly the coupling the subprocess transport exists to avoid: one
# agent pinning an incompatible version would then break the others. Each
# agent is synced independently, from its own folder.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]
# The platform's own tests live beside the code they test, but they are not
# part of the shipped package.
exclude = ["orchestrator/tests"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.14", "mypy>=1.14", "types-PyYAML>=6.0", "pre-commit>=4.0"]

[tool.pytest.ini_options]
cache_dir = ".cache/pytest"
# `agents/_template/tests` is the starter suite every contributor copies. It
# was run by no gate at all — root pytest did not collect it, and `agents
# test` skips unregistered folders — so it could break and the first person to
# find out would be an intern debugging their own copy of it.
# Do NOT add a real agent's tests here. Each agent runs its own suite from
# its own folder via `runtime.test`, which makes that folder the rootdir; two
# agents both copying the template's `tests/test_agent.py` collide on module
# name the moment they share one rootdir, and pytest fails at collection.
testpaths = ["orchestrator/tests", "agents/_template/tests"]

# The orchestrator is held to the same bar it asks of agents. realty-lead-gen
# runs ruff and strict mypy on itself; shared code that everything else
# depends on has no business being the unchecked part of the repo.

# Scope: root tooling lints platform code only — `orchestrator` (which now
# holds its own tests) and `agents/_template`, which the platform owns and
# ships. Real agent folders configure and lint themselves, the same way they
# own their dependencies; running root's rules over an agent would contradict
# the isolation the whole design rests on. Commands pass explicit paths rather
# than `.` for exactly that reason.

[tool.ruff]
# Caches go under .cache/, not the root. `.ruff_cache/` and friends are
# gitignored and never reach a clone, but they do clutter the directory the
# person building an agent is actually looking at — and "what is .ruff_cache"
# is a question the layout should not make anyone ask.
cache-dir = ".cache/ruff"
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Same selection as realty-lead-gen, minus the rules that only matter for a
# web service. S (bandit) is on: this package spawns processes and reads YAML.
# TCH is deliberately absent — TYPE_CHECKING blocks buy nothing in a package
# this small and cost readability in code people are meant to learn from.
select = [
    "E", "W", "F", "I", "UP", "B", "BLE", "SIM", "N", "RUF",
    "S", "DTZ", "PL", "TRY", "PERF", "LOG",
]
ignore = [
    "E501",    # line length is the formatter's job
    "TRY003",  # long exception messages are the point — they name the file
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, spawn stub agents, and compare against literal values on
# purpose; naming every expected number would obscure what is being asserted.
# `**` so the template's own starter tests are covered too — they are the
# example a contributor copies, and they spawn the agent deliberately.
"**/tests/*" = ["S101", "S603", "S607", "PLR2004"]

[tool.mypy]
cache_dir = ".cache/mypy"
python_version = "3.13"
strict = true
warn_unreachable = true
# Shipped code only. Strict annotations on pytest fixtures buy little and
# cost readability, so the suite is excluded now that it sits inside the
# package it tests. `agents/_template` is out of scope for the same reason
# doubled: its job is to be read.
files = ["orchestrator"]
exclude = ["^orchestrator/tests/"]
