[project]
name = "agents-orchestrator"
version = "0.1.0"
description = "Discovers and calls the agents in this repository over agentcall/v1."
readme = "README.md"
requires-python = ">=3.13"

# One dependency, on purpose. The orchestrator's job is to read a manifest
# and spawn a process; everything else is the standard library. Each agent
# brings its own dependency set inside its own folder, which is what keeps a
# heavy agent from making the orchestrator heavy.
dependencies = ["pyyaml>=6.0"]

[project.scripts]
agents = "orchestrator.cli:main"

# Deliberately NOT a uv workspace. Declaring the agent folders as workspace
# members would resolve every agent's dependencies into one lockfile, which
# is exactly the coupling the subprocess transport exists to avoid: one
# agent pinning an incompatible version would then break the others. Each
# agent is synced independently, from its own folder.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.14", "mypy>=1.14", "types-PyYAML>=6.0", "pre-commit>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# The orchestrator is held to the same bar it asks of agents. realty-lead-gen
# runs ruff and strict mypy on itself; shared code that everything else
# depends on has no business being the unchecked part of the repo.

# Scope: root tooling lints root-owned code only — `orchestrator`, `tests`,
# and `_template`. Agent folders configure and lint themselves, the same way
# they own their dependencies; running root's rules over an agent would
# contradict the isolation the whole design rests on. Commands therefore pass
# explicit paths rather than `.` (see `make lint` equivalents in CI).

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# Same selection as realty-lead-gen, minus the rules that only matter for a
# web service. S (bandit) is on: this package spawns processes and reads YAML.
# TCH is deliberately absent — TYPE_CHECKING blocks buy nothing in a package
# this small and cost readability in code people are meant to learn from.
select = [
    "E", "W", "F", "I", "UP", "B", "BLE", "SIM", "N", "RUF",
    "S", "DTZ", "PL", "TRY", "PERF", "LOG",
]
ignore = [
    "E501",    # line length is the formatter's job
    "TRY003",  # long exception messages are the point — they name the file
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, spawn stub agents, and compare against literal values on
# purpose; naming every expected number would obscure what is being asserted.
# `**` so the template's own starter tests are covered too — they are the
# example a contributor copies, and they spawn the agent deliberately.
"**/tests/*" = ["S101", "S603", "S607", "PLR2004"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
# Shipped code only, matching realty-lead-gen, which types-checks `src` and
# `scripts` but not its tests. Strict annotations on pytest fixtures buy
# little and cost readability. `_template` is excluded for the same reason
# doubled: its job is to be read.
files = ["orchestrator"]
