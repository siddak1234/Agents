# Hooks for root-owned code only — `orchestrator/`, `tests/`, `_template/`.
#
# Agent folders are excluded on purpose. Each agent owns its toolchain and its
# standards the same way it owns its dependencies; running root's rules across
# an agent would break the isolation the whole design rests on.
# realty-lead-gen has its own .pre-commit-config.yaml, run from its folder.
#
#   uv run pre-commit install

default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
        # Every manifest and workflow in the repo — a malformed agent.yaml
        # should fail here, not halfway through discovery.
      - id: check-added-large-files
        args: [--maxkb=512]

  # This repository is public. realty-lead-gen has scanned itself since before
  # the move; the root did not, which meant commits made from here — where
  # everyone actually commits — were unscanned. Same pin as the agent uses.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.0
    hooks:
      - id: ruff-format
        files: ^(orchestrator|agents/_template)/
      - id: ruff
        args: [--fix]
        files: ^(orchestrator|agents/_template)/

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict, orchestrator)
        entry: uv run --frozen mypy orchestrator
        language: system
        pass_filenames: false
        files: ^orchestrator/

      # Cheap and catches the mistake people actually make: adding an agent
      # and forgetting to register it, or renaming a folder without renaming
      # the manifest. No network, no credentials, no cost.
      - id: agents-check
        name: agents check
        entry: uv run --frozen agents check
        language: system
        pass_filenames: false
        # The entrypoints belong here. `agents check` runs the agent and
        # compares what `describe` reports against the manifest — and an
        # 821-line edit to `agent_main.py` alone matched none of these
        # patterns, so the one gate that actually executes the agent never
        # ran locally. `registry.yaml` was also unescaped.
        #
        # One line on purpose: a folded scalar (`>-`) joins lines with a space,
        # which lands inside the alternation and silently stops a branch from
        # ever matching.
        #
        # `orchestrator/.*`, not `orchestrator/`: the whole pattern is
        # anchored `^(…)$`, so a bare directory prefix can never match a real
        # file. Proven by a commit that changed three orchestrator modules
        # while both hooks reported "no files to check".
        files: ^(registry\.yaml|orchestrator/.*|.*/agent\.yaml|.*/agent_main\.py|.*/agentcall\.py)$

      # Same question CI asks, asked before the push rather than before each
      # commit: straying is a property of the branch, and blocking a
      # work-in-progress commit that will be amended teaches nothing. Install
      # with `pre-commit install --hook-type pre-push` to get it locally; CI
      # is the authority either way, and the command skips itself when
      # `origin/main` is absent or stale rather than guessing.
      - id: agents-scope
        name: agents scope
        entry: uv run --frozen agents scope
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # The integration gate, run before the commit rather than after the
      # push. CI enforces it either way; the difference is whether a
      # contributor finds out in two seconds or after waiting for a build.
      - id: agents-integration
        name: agents list --strict
        entry: uv run --frozen agents list --strict
        language: system
        pass_filenames: false
        # `--strict` now scans an agent's whole folder for TODO markers, not
        # just its manifest, so an entrypoint or starter-test edit can change
        # the answer too. One line — see the notes on agents-check above,
        # including why it is `orchestrator/.*` and never `orchestrator/`.
        files: ^(registry\.yaml|README\.md|orchestrator/.*|.*/agent\.yaml|.*/LICENSE|.*/README\.md|.*/agent_main\.py|.*/agentcall\.py)$
